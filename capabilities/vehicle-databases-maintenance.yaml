naftiko: 1.0.0-alpha2
info:
  label: Vehicle Databases Maintenance API — Maintenance
  description: 'Vehicle Databases Maintenance API — Maintenance. 1 operations. Lead operation: Vehicle Databases Get Maintenance
    Schedule. Self-contained Naftiko capability covering one Vehicle Databases business surface.'
  tags:
  - Vehicle Databases
  - Maintenance
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VEHICLE_DATABASES_API_KEY: VEHICLE_DATABASES_API_KEY
capability:
  consumes:
  - type: http
    namespace: vehicle-databases-maintenance
    baseUri: https://api.vehicledatabases.com/v1
    description: Vehicle Databases Maintenance API — Maintenance business capability. Self-contained, no shared references.
    resources:
    - name: maintenance-vehicleId
      path: /maintenance/{vehicleId}
      operations:
      - name: getmaintenanceschedule
        method: GET
        description: Vehicle Databases Get Maintenance Schedule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: vehicleId
          in: path
          type: string
          description: Vehicle identifier from lookup or VIN decode
          required: true
        - name: mileage
          in: query
          type: integer
          description: Current vehicle mileage to filter upcoming services
        - name: includeItems
          in: query
          type: boolean
          description: Include detailed service items in response
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.VEHICLE_DATABASES_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: vehicle-databases-maintenance-rest
    port: 8080
    description: REST adapter for Vehicle Databases Maintenance API — Maintenance. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/maintenance/{vehicleid}
      name: maintenance-vehicleid
      description: REST surface for maintenance-vehicleId.
      operations:
      - method: GET
        name: getmaintenanceschedule
        description: Vehicle Databases Get Maintenance Schedule
        call: vehicle-databases-maintenance.getmaintenanceschedule
        with:
          vehicleId: rest.vehicleId
          mileage: rest.mileage
          includeItems: rest.includeItems
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: vehicle-databases-maintenance-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vehicle Databases Maintenance API — Maintenance. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: vehicle-databases-get-maintenance-schedule
      description: Vehicle Databases Get Maintenance Schedule
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: vehicle-databases-maintenance.getmaintenanceschedule
      with:
        vehicleId: tools.vehicleId
        mileage: tools.mileage
        includeItems: tools.includeItems
      outputParameters:
      - type: object
        mapping: $.
