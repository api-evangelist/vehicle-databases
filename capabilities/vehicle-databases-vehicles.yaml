naftiko: 1.0.0-alpha2
info:
  label: Vehicle Databases Maintenance API — Vehicles
  description: 'Vehicle Databases Maintenance API — Vehicles. 2 operations. Lead operation: Vehicle Databases Lookup Vehicle.
    Self-contained Naftiko capability covering one Vehicle Databases business surface.'
  tags:
  - Vehicle Databases
  - Vehicles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VEHICLE_DATABASES_API_KEY: VEHICLE_DATABASES_API_KEY
capability:
  consumes:
  - type: http
    namespace: vehicle-databases-vehicles
    baseUri: https://api.vehicledatabases.com/v1
    description: Vehicle Databases Maintenance API — Vehicles business capability. Self-contained, no shared references.
    resources:
    - name: vehicle
      path: /vehicle
      operations:
      - name: lookupvehicle
        method: GET
        description: Vehicle Databases Lookup Vehicle
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: make
          in: query
          type: string
          description: Vehicle make (e.g. Toyota, Ford, Chevrolet)
          required: true
        - name: model
          in: query
          type: string
          description: Vehicle model (e.g. Camry, F-150)
          required: true
        - name: year
          in: query
          type: integer
          description: 4-digit model year
          required: true
    - name: vin-vin
      path: /vin/{vin}
      operations:
      - name: decodevin
        method: GET
        description: Vehicle Databases Decode VIN
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: vin
          in: path
          type: string
          description: 17-character Vehicle Identification Number
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.VEHICLE_DATABASES_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: vehicle-databases-vehicles-rest
    port: 8080
    description: REST adapter for Vehicle Databases Maintenance API — Vehicles. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/vehicle
      name: vehicle
      description: REST surface for vehicle.
      operations:
      - method: GET
        name: lookupvehicle
        description: Vehicle Databases Lookup Vehicle
        call: vehicle-databases-vehicles.lookupvehicle
        with:
          make: rest.make
          model: rest.model
          year: rest.year
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/vin/{vin}
      name: vin-vin
      description: REST surface for vin-vin.
      operations:
      - method: GET
        name: decodevin
        description: Vehicle Databases Decode VIN
        call: vehicle-databases-vehicles.decodevin
        with:
          vin: rest.vin
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: vehicle-databases-vehicles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vehicle Databases Maintenance API — Vehicles. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: vehicle-databases-lookup-vehicle
      description: Vehicle Databases Lookup Vehicle
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: vehicle-databases-vehicles.lookupvehicle
      with:
        make: tools.make
        model: tools.model
        year: tools.year
      outputParameters:
      - type: object
        mapping: $.
    - name: vehicle-databases-decode-vin
      description: Vehicle Databases Decode VIN
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: vehicle-databases-vehicles.decodevin
      with:
        vin: tools.vin
      outputParameters:
      - type: object
        mapping: $.
