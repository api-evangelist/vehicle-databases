naftiko: 1.0.0-alpha2
info:
  label: Vehicle Databases Maintenance API — TSBs
  description: 'Vehicle Databases Maintenance API — TSBs. 1 operations. Lead operation: Vehicle Databases Get TSBs. Self-contained
    Naftiko capability covering one Vehicle Databases business surface.'
  tags:
  - Vehicle Databases
  - TSBs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VEHICLE_DATABASES_API_KEY: VEHICLE_DATABASES_API_KEY
capability:
  consumes:
  - type: http
    namespace: vehicle-databases-tsbs
    baseUri: https://api.vehicledatabases.com/v1
    description: Vehicle Databases Maintenance API — TSBs business capability. Self-contained, no shared references.
    resources:
    - name: tsb-vehicleId
      path: /tsb/{vehicleId}
      operations:
      - name: gettsbs
        method: GET
        description: Vehicle Databases Get TSBs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: vehicleId
          in: path
          type: string
          description: Vehicle identifier
          required: true
        - name: category
          in: query
          type: string
          description: TSB category filter (e.g. Engine, Electrical, HVAC)
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.VEHICLE_DATABASES_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: vehicle-databases-tsbs-rest
    port: 8080
    description: REST adapter for Vehicle Databases Maintenance API — TSBs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/tsb/{vehicleid}
      name: tsb-vehicleid
      description: REST surface for tsb-vehicleId.
      operations:
      - method: GET
        name: gettsbs
        description: Vehicle Databases Get TSBs
        call: vehicle-databases-tsbs.gettsbs
        with:
          vehicleId: rest.vehicleId
          category: rest.category
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: vehicle-databases-tsbs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vehicle Databases Maintenance API — TSBs. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: vehicle-databases-get-tsbs
      description: Vehicle Databases Get TSBs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: vehicle-databases-tsbs.gettsbs
      with:
        vehicleId: tools.vehicleId
        category: tools.category
      outputParameters:
      - type: object
        mapping: $.
