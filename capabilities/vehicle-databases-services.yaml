naftiko: 1.0.0-alpha2
info:
  label: Vehicle Databases Maintenance API — Services
  description: 'Vehicle Databases Maintenance API — Services. 1 operations. Lead operation: Vehicle Databases List Service
    Items. Self-contained Naftiko capability covering one Vehicle Databases business surface.'
  tags:
  - Vehicle Databases
  - Services
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VEHICLE_DATABASES_API_KEY: VEHICLE_DATABASES_API_KEY
capability:
  consumes:
  - type: http
    namespace: vehicle-databases-services
    baseUri: https://api.vehicledatabases.com/v1
    description: Vehicle Databases Maintenance API — Services business capability. Self-contained, no shared references.
    resources:
    - name: services-vehicleId
      path: /services/{vehicleId}
      operations:
      - name: listserviceitems
        method: GET
        description: Vehicle Databases List Service Items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: vehicleId
          in: path
          type: string
          description: Vehicle identifier
          required: true
        - name: mileage
          in: query
          type: integer
          description: Service interval mileage
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.VEHICLE_DATABASES_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: vehicle-databases-services-rest
    port: 8080
    description: REST adapter for Vehicle Databases Maintenance API — Services. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/services/{vehicleid}
      name: services-vehicleid
      description: REST surface for services-vehicleId.
      operations:
      - method: GET
        name: listserviceitems
        description: Vehicle Databases List Service Items
        call: vehicle-databases-services.listserviceitems
        with:
          vehicleId: rest.vehicleId
          mileage: rest.mileage
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: vehicle-databases-services-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vehicle Databases Maintenance API — Services. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: vehicle-databases-list-service-items
      description: Vehicle Databases List Service Items
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: vehicle-databases-services.listserviceitems
      with:
        vehicleId: tools.vehicleId
        mileage: tools.mileage
      outputParameters:
      - type: object
        mapping: $.
